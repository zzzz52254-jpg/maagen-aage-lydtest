<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drageøens hemmelighed</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  margin: 0;
  background: #10243e url('maagen-aage-background.png') center/cover fixed no-repeat;
  color: #10243e;
  font-family: Arial, sans-serif;
}

main {
  width: min(92vw, 520px);
  margin: auto;
  padding: 14px 0 28px;
}

h1 {
  margin: 0 0 18px;
  padding: 11px 14px;
  text-align: center;
  font-size: clamp(24px, 7vw, 34px);
  line-height: 1.1;
  color: #10243e;
  background: rgba(255,255,255,.92);
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,.18);
}

.chapter-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  justify-items: center;
}

.track {
  width: 74px;
  height: 74px;
  padding: 0;
  border: 3px solid #aab6c7;
  border-radius: 50%;
  background: rgba(255,255,255,.94);
  color: #10243e;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow: 0 3px 9px rgba(0,0,0,.22);

  -webkit-tap-highlight-color: transparent;
}

.track:hover {
  transform: scale(1.05);
}

.track.active {
  background: #dfefff;
  border-color: #4f78ad;

  box-shadow:
    0 0 0 4px rgba(79,120,173,.22),
    0 4px 12px rgba(0,0,0,.25);
}

.letter {
  display: block;
  color: #10243e;
  font-size: 28px;
  line-height: 1;
  font-weight: bold;
}

.status {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

@media (max-width: 420px) {

  main {
    width: 94vw;
    padding-top: 10px;
  }

  h1 {
    font-size: 25px;
    margin-bottom: 14px;
  }

  .chapter-grid {
    gap: 12px;
  }

  .track {
    width: 64px;
    height: 64px;
  }

  .letter {
    font-size: 25px;
  }
}
</style>
</head>


<body>

<main>

<h1>Drageøens hemmelighed</h1>

<div id="status" class="status" aria-live="polite">
Klar til afspilning.
</div>

<div class="chapter-grid">

<button
  class="track"
  data-file="hav_og_maager.mp3"
  type="button"
  aria-label="Kapitel A">
  <span class="letter">A</span>
</button>


<button
  class="track"
  data-file="storm_over_havet_af_skyer.mp3"
  type="button"
  aria-label="Kapitel B">
  <span class="letter">B</span>
</button>


<button
  class="track"
  data-file="skyggernes_labyrint_scene.mp3"
  type="button"
  aria-label="Kapitel C">
  <span class="letter">C</span>
</button>


<button
  class="track"
  data-file="de_sovende_drager_scene.mp3"
  type="button"
  aria-label="Kapitel D">
  <span class="letter">D</span>
</button>


<button
  class="track"
  data-file="ild.mp3"
  type="button"
  aria-label="Kapitel E">
  <span class="letter">E</span>
</button>


<button
  id="dragefestival"
  class="track"
  type="button"
  aria-label="Dragefestivalen">
  <span class="letter">F</span>
</button>

</div>

</main>


<script>

const player = new Audio();

player.preload = 'auto';

const status = document.getElementById('status');

const buttons = [
  ...document.querySelectorAll('.track[data-file]')
];

const festivalButton =
  document.getElementById('dragefestival');

let festivalTracks = [];


/* Stop almindelig kapitellyd */

function stopChapter() {

  player.pause();

  player.currentTime = 0;

  player.removeAttribute('src');

  player.load();
}


/* Stop Dragefestival */

function stopFestival() {

  festivalTracks.forEach(audio => {

    audio.pause();

    audio.currentTime = 0;

  });

  festivalTracks = [];

  festivalButton.classList.remove('active');
}


/* Fjern aktiv markering fra alle knapper */

function clearActive() {

  buttons.forEach(button => {

    button.classList.remove('active');

  });

  festivalButton.classList.remove('active');
}


/*
   Kapitel A-E

   Første tryk:
   Start lyd.

   Andet tryk på samme knap:
   Stop lyd.

   Tryk på en anden knap:
   Stop den gamle lyd
   og start den nye.
*/

buttons.forEach(button => {

  button.addEventListener('click', async () => {

    const file = button.dataset.file;


    /* Samme knap trykkes igen = STOP */

    if (button.classList.contains('active')) {

      stopChapter();

      button.classList.remove('active');

      status.textContent =
        'Afspilning stoppet.';

      return;
    }


    /* Stop alt andet */

    stopFestival();

    stopChapter();

    clearActive();


    /* Marker denne knap som aktiv */

    button.classList.add('active');


    /* Indlæs lydfil */

    player.src = file;

    player.loop = true;

    player.load();


    try {

      await player.play();

      status.textContent =
        'Afspiller lyd.';

    }

    catch (error) {

      console.error(error);

      button.classList.remove('active');

      status.textContent =
        'Kunne ikke starte lydfilen: ' + file;

    }

  });

});


/*
   DRAGEFESTIVAL

   Første tryk:
   Start begge festival-lyde.

   Andet tryk:
   Stop begge festival-lyde.
*/

festivalButton.addEventListener('click', async () => {


  /* Hvis festivalen allerede spiller = STOP */

  if (festivalTracks.length > 0) {

    stopFestival();

    status.textContent =
      'Afspilning stoppet.';

    return;
  }


  /* Stop eventuelt kapitel */

  stopChapter();

  clearActive();


  /* Festivalens to lydspor */

  festivalTracks = [

    new Audio('festmusik.mp3'),

    new Audio('grotte_ambience.mp3')

  ];


  /* Musik */

  festivalTracks[0].loop = true;

  festivalTracks[0].volume = 0.15;


  /* Grotte */

  festivalTracks[1].loop = true;

  festivalTracks[1].volume = 1;


  /* Marker F som aktiv */

  festivalButton.classList.add('active');


  try {

    await Promise.all(

      festivalTracks.map(audio => {

        audio.load();

        return audio.play();

      })

    );

    status.textContent =
      'Afspiller Dragefestival.';

  }

  catch (error) {

    console.error(error);

    stopFestival();

    status.textContent =
      'Kunne ikke starte Dragefestivalen.';

  }

});


/* Fejl ved lydfil */

player.addEventListener('error', () => {

  if (player.src) {

    status.textContent =
      'Kunne ikke indlæse lydfilen.';

  }

});

</script>

</body>
</html>
