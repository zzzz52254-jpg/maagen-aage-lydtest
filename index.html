<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drageøens hemmelighed</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
    margin: 0;
    min-height: 100vh;

    background-color: #10243e;
    background-image: url('./maagen-aage-baggrund.png');
    background-position: center center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: #10243e;
    font-family: Arial, sans-serif;

main {
  width: min(92vw, 520px);
  margin: auto;
  padding: 14px 0 28px;
}

h1 {
  margin: 0 0 18px;
  padding: 11px 14px;
  text-align: center;
  font-size: clamp(24px, 7vw, 34px);
  line-height: 1.1;
  color: #10243e;
  background: rgba(255,255,255,.92);
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,.18);
}

.chapter-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  justify-items: center;
}

.track {
  width: 74px;
  height: 74px;
  padding: 0;
  border: 3px solid #aab6c7;
  border-radius: 50%;
  background: rgba(255,255,255,.94);
  color: #10243e;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow: 0 3px 9px rgba(0,0,0,.22);

  -webkit-tap-highlight-color: transparent;
}

.track:hover {
  transform: scale(1.05);
}

.track.active {
  background: #dfefff;
  border-color: #4f78ad;

  box-shadow:
    0 0 0 4px rgba(79,120,173,.22),
    0 4px 12px rgba(0,0,0,.25);
}

.letter {
  display: block;
  color: #10243e;
  font-size: 28px;
  line-height: 1;
  font-weight: bold;
}

.status {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

@media (max-width: 420px) {

  main {
    width: 94vw;
    padding-top: 10px;
  }

  h1 {
    font-size: 25px;
    margin-bottom: 14px;
  }

  .chapter-grid {
    gap: 12px;
  }

  .track {
    width: 64px;
    height: 64px;
  }

  .letter {
    font-size: 25px;
  }
}
</style>
</head>


<body>

<main>

<h1>Drageøens hemmelighed</h1>

<div id="status" class="status" aria-live="polite">
Klar til afspilning.
</div>

<div class="chapter-grid">

<button
  class="track"
  data-file="hav_og_maager.mp3"
  type="button"
  aria-label="Kapitel A">
  <span class="letter">A</span>
</button>


<button
  class="track"
  data-file="storm_over_havet_af_skyer.mp3"
  type="button"
  aria-label="Kapitel B">
  <span class="letter">B</span>
</button>


<button
  class="track"
  data-file="skyggernes_labyrint_scene.mp3"
  type="button"
  aria-label="Kapitel C">
  <span class="letter">C</span>
</button>


<button
  class="track"
  data-file="de_sovende_drager_scene.mp3"
  type="button"
  aria-label="Kapitel D">
  <span class="letter">D</span>
</button>


<button
  class="track"
  data-file="ild.mp3"
  type="button"
  aria-label="Kapitel E">
  <span class="letter">E</span>
</button>


<button
  id="dragefestival"
  class="track"
  type="button"
  aria-label="Dragefestivalen">
  <span class="letter">F</span>
</button>

</div>

</main>

<script>

const status = document.getElementById('status');
const buttons = document.querySelectorAll('.track[data-file]');
const festivalButton = document.getElementById('dragefestival');

let currentAudio = null;
let festivalTracks = [];


/* -----------------------------
   STOP AL LYD
----------------------------- */

function stopAllAudio() {

    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
    }

    festivalTracks.forEach(audio => {
        audio.pause();
        audio.currentTime = 0;
    });

    festivalTracks = [];

}


/* -----------------------------
   FJERN AKTIV MARKERING
----------------------------- */

function clearActive() {

    buttons.forEach(button => {
        button.classList.remove('active');
    });

    festivalButton.classList.remove('active');

}


/* -----------------------------
   KAPITEL A-E
----------------------------- */

buttons.forEach(button => {

    button.addEventListener('click', function () {

        const file = button.dataset.file;

        /* Hvis samme knap trykkes igen */
        if (
            currentAudio &&
            currentAudio.src.endsWith(file) &&
            !currentAudio.paused
        ) {

            currentAudio.pause();
            currentAudio.currentTime = 0;
            currentAudio = null;

            button.classList.remove('active');

            status.textContent = 'Afspilning stoppet.';

            return;
        }


        /* Stop alt andet */
        stopAllAudio();

        clearActive();


        /* Marker knappen */
        button.classList.add('active');


        /* Opret ny lyd */
        const audio = new Audio(file);

        audio.loop = true;
        audio.preload = 'auto';

        currentAudio = audio;


        /* Hvis lydfilen ikke kan findes */
        audio.addEventListener('error', function () {

            console.error('Kunne ikke indlæse:', file);

            button.classList.remove('active');

            currentAudio = null;

            status.textContent =
                'Kunne ikke indlæse lydfilen: ' + file;

        });


        /* Start lyd */
        audio.play()
            .then(function () {

                status.textContent =
                    'Afspiller: ' + file;

            })
            .catch(function (error) {

                console.error('Afspilning fejlede:', error);

                button.classList.remove('active');

                currentAudio = null;

                status.textContent =
                    'Browseren kunne ikke afspille lydfilen: ' + file;

            });

    });

});


/* -----------------------------
   DRAGEFESTIVAL
----------------------------- */

festivalButton.addEventListener('click', function () {

    /* Hvis festivalen allerede spiller */
    if (festivalTracks.length > 0) {

        stopAllAudio();

        clearActive();

        status.textContent = 'Dragefestival stoppet.';

        return;
    }


    /* Stop kapitel */
    stopAllAudio();

    clearActive();


    /* Festivalens to lydspor */
    const music = new Audio('festmusik.mp3');
    const ambience = new Audio('grotte_ambience.mp3');


    music.loop = true;
    ambience.loop = true;

    music.volume = 0.15;
    ambience.volume = 1.0;


    festivalTracks = [
        music,
        ambience
    ];


    /* Marker festival-knappen */
    festivalButton.classList.add('active');


    /* Start begge lydspor */
    Promise.all([
        music.play(),
        ambience.play()
    ])
    .then(function () {

        status.textContent =
            'Afspiller Dragefestival.';

    })
    .catch(function (error) {

        console.error('Dragefestival kunne ikke starte:', error);

        stopAllAudio();

        festivalButton.classList.remove('active');

        status.textContent =
            'Kunne ikke afspille Dragefestival.';

    });

});

</script>
